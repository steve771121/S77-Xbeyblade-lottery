<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>S77 戰鬥陀螺抽籤助手</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2e;--line:#203650;--text:#f3f7fb;--muted:#90a5bc;--accent:#39d0ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text)}
body{display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d1b2e,#091522)}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#112a40;border:1px solid #28506e;font-weight:900;color:var(--accent)}
.title{min-width:0;flex:1}.title strong{display:block;font-size:15px}.title span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.open{border:1px solid #2a5876;background:#10283a;color:#dff8ff;text-decoration:none;padding:8px 11px;border-radius:10px;font-size:12px;white-space:nowrap}
main{position:relative;flex:1;min-height:0}
iframe{width:100%;height:100%;border:0;background:#fff}
.fallback{position:absolute;inset:0;z-index:-1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
footer{position:absolute;right:10px;bottom:10px;pointer-events:none;background:rgba(7,17,31,.82);border:1px solid rgba(76,126,160,.35);border-radius:999px;padding:5px 9px;color:#8ca5b8;font-size:10px;backdrop-filter:blur(8px)}
@media(max-width:560px){header{padding:9px 10px}.logo{width:30px;height:30px}.title strong{font-size:14px}.title span{font-size:10px}.open{padding:7px 9px}}
</style>
</head>
<body>
<header>
  <div class="logo">X</div>
  <div class="title">
    <strong>S77 戰鬥陀螺抽籤助手</strong>
    <span>2026/09/18 最新抽選資料 · FUNBOX / 來玩聚</span>
  </div>
  <a class="open" href="https://uxux11.github.io/funbox-line/" target="_blank" rel="noopener">另開抽籤頁 ↗</a>
</header>
<main>
  <div class="fallback">正在載入最新抽選資料…<br>若畫面沒有出現，請按右上角「另開抽籤頁」。</div>
  <iframe src="https://uxux11.github.io/funbox-line/" title="戰鬥陀螺抽選目錄" allow="clipboard-read; clipboard-write"></iframe>
  <footer>資料來源：公開店家抽選資訊</footer>
</main>
</body>
</html>
