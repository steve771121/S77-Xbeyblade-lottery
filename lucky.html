<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幸運戰鬥抽籤｜S77 戰鬥陀螺抽籤助手</title>
<style>
:root{--bg:#eef3f9;--card:#fff;--text:#162033;--muted:#6b7280;--border:#dce3ec;--navy:#10223f;--gold:#e7a91a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#fff8de 0,#f4f7fb 35%,#eaf0f7 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px 12px 42px}
.back{display:inline-flex;color:#334155;text-decoration:none;font-size:14px;font-weight:800;margin:0 0 10px}
.top-link{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,#0e1c35,#234d86);color:#fff;text-decoration:none;font-size:16px;font-weight:950;box-shadow:0 9px 20px rgba(31,73,125,.22);margin-bottom:15px}
.hero{text-align:center;padding:8px 6px 14px}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.16em;color:#9b6b00}.hero h1{font-size:28px;margin:6px 0 7px}.hero p{max-width:620px;margin:auto;color:var(--muted);font-size:14px;line-height:1.65}
.game-card{background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:22px;padding:16px;box-shadow:0 15px 35px rgba(15,23,42,.09);overflow:hidden}
.score-guide{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.score-chip{font-size:12px;font-weight:900;padding:6px 10px;border-radius:999px;background:#f8fafc;border:1px solid #dbe4ef;color:#475569}
.battlefield{position:relative;height:355px;max-width:640px;margin:0 auto 13px;perspective:760px;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,#eaf2fb 0,#d3dfec 48%,#aab9c9 100%);box-shadow:inset 0 0 0 2px rgba(44,63,86,.12),inset 0 -20px 35px rgba(38,53,72,.28),0 16px 25px rgba(15,23,42,.16)}
.battlefield:before{content:"";position:absolute;left:50%;top:53%;width:91%;height:70%;transform:translate(-50%,-50%) rotateX(60deg);border-radius:50%;background:
radial-gradient(ellipse at center,#dce7f2 0 12%,#b9c8d8 13% 22%,#eef4f9 23% 43%,#b3c2d2 44% 47%,#dbe5ef 48% 67%,#718398 68% 71%,#c9d5e1 72% 100%);
box-shadow:inset 0 0 0 5px rgba(255,255,255,.42),inset 0 -18px 26px rgba(25,39,57,.25),0 20px 26px rgba(28,43,61,.22)}
.battlefield:after{content:"";position:absolute;left:50%;top:51%;width:69%;height:49%;transform:translate(-50%,-50%) rotateX(60deg);border-radius:50%;border:2px dashed rgba(38,78,126,.18);box-shadow:0 0 0 24px rgba(255,255,255,.06)}
.rim{position:absolute;left:50%;top:52%;width:95%;height:73%;transform:translate(-50%,-50%) rotateX(60deg);border:10px solid #7c8ea3;border-radius:50%;box-shadow:inset 0 8px 0 #c8d5e2,0 8px 0 #526276,0 18px 22px rgba(15,23,42,.25);z-index:1;pointer-events:none}
.hole{position:absolute;z-index:3;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,#0a1019 0 45%,#253244 46% 58%,#8999aa 59% 65%,#c7d3df 66% 100%);box-shadow:inset 0 9px 12px rgba(0,0,0,.65),0 2px 0 rgba(255,255,255,.45);transform:rotateX(60deg);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:950;text-shadow:0 1px 2px #000}
.hole span{transform:rotateX(-60deg);opacity:.78}
.hole-left{left:10%;top:48%;width:74px;height:40px}.hole-right{right:10%;top:48%;width:74px;height:40px}.hole-center{left:50%;top:65%;width:94px;height:48px;transform:translateX(-50%) rotateX(60deg)}
.top-wrap{position:absolute;z-index:8;width:112px;height:112px;transform:translate(-50%,-50%);will-change:left,top,transform,opacity}
.top-a{left:24%;top:35%}.top-b{left:76%;top:37%}
.top-model{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-8deg);filter:drop-shadow(0 13px 9px rgba(4,10,22,.38))}
.rotor{position:absolute;inset:0;transform-origin:center;animation:idleSpin 1.4s linear infinite}
.layer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.shell{width:108px;height:108px;background:conic-gradient(from 8deg,#69ecff 0 8%,#168ac7 8% 14%,#203273 14% 21%,#67e7ff 21% 29%,#0f6fb2 29% 37%,#291e79 37% 45%,#64e4ff 45% 53%,#1075bd 53% 61%,#251c78 61% 69%,#62eaff 69% 77%,#1280bf 77% 85%,#1c286b 85% 93%,#6beaff 93% 100%);clip-path:polygon(50% 0,59% 14%,76% 5%,82% 23%,100% 31%,87% 46%,99% 59%,80% 68%,87% 88%,65% 84%,56% 100%,43% 86%,25% 98%,22% 77%,4% 83%,14% 62%,0 49%,16% 37%,8% 17%,31% 19%);box-shadow:inset 0 5px 6px rgba(255,255,255,.62),inset 0 -8px 11px rgba(11,28,87,.5)}
.shell:before{content:"";position:absolute;inset:7px;border-radius:50%;background:conic-gradient(#142760,#4330a4,#12285d,#213e9b,#18255e,#4b31a4,#13275f);clip-path:polygon(50% 0,65% 17%,85% 12%,84% 36%,100% 48%,78% 61%,85% 87%,62% 77%,47% 100%,34% 77%,8% 86%,18% 58%,0 43%,22% 31%,14% 7%,39% 20%)}
.metal{width:72px;height:72px;background:conic-gradient(#fff,#8b98a8,#e7edf3,#6d7b8d,#fff,#8997a8,#dfe6ed,#627083,#fff);box-shadow:inset 0 0 0 6px rgba(255,255,255,.52),inset 0 -8px 10px rgba(45,57,72,.32),0 0 0 3px #28456f}
.inner{width:52px;height:52px;background:conic-gradient(#173d7b,#267dc1,#211875,#5acfe9,#173e7d,#332083,#48c9ec,#173d7b);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.core{width:31px;height:31px;background:radial-gradient(circle at 37% 30%,#fff 0 8%,#aef8ff 9% 17%,#39bfe7 18% 31%,#284d98 32% 50%,#2e1f83 51% 69%,#0a1638 70%);box-shadow:0 0 0 3px #e1e8ef,0 0 0 6px #5a687a,inset 0 -5px 7px rgba(0,0,0,.38)}
.depth{position:absolute;left:15%;right:15%;bottom:-14px;height:25px;border-radius:50%;background:linear-gradient(180deg,#17376e,#1e2869 45%,#121943 70%,#070b1b);box-shadow:inset 0 6px 6px rgba(96,196,255,.28),inset 0 -7px 8px rgba(0,0,0,.5);z-index:-2}
.tip{position:absolute;left:50%;bottom:-30px;width:31px;height:34px;transform:translateX(-50%);border-radius:9px 9px 50% 50%;background:linear-gradient(#3158a9,#292b78 48%,#482c86 76%,#17132f);box-shadow:inset 0 5px 5px rgba(133,211,255,.3),inset 0 -6px 7px rgba(0,0,0,.5);z-index:-3}
.top-b .shell{filter:hue-rotate(145deg) saturate(1.12)}.top-b .shell:before,.top-b .inner,.top-b .core{filter:hue-rotate(145deg) saturate(1.18)}
@keyframes idleSpin{to{transform:rotate(360deg)}}
.battlefield.battle .top-a{animation:pathA 2.25s cubic-bezier(.35,.05,.55,.98) forwards}
.battlefield.battle .top-b{animation:pathB 2.25s cubic-bezier(.35,.05,.55,.98) forwards}
.battlefield.battle .rotor{animation-duration:.12s}
@keyframes pathA{0%{left:24%;top:35%}28%{left:35%;top:57%}55%{left:49%;top:48%}72%{left:40%;top:38%}100%{left:48%;top:45%}}
@keyframes pathB{0%{left:76%;top:37%}28%{left:65%;top:55%}55%{left:51%;top:48%}72%{left:61%;top:39%}100%{left:52%;top:45%}}
.impact{position:absolute;z-index:20;left:50%;top:48%;width:12px;height:12px;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.impact.flash{animation:impactFlash .7s ease-out}.impact:before{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 18px #fff,0 0 36px #ffd34f,0 0 70px #ff8a00}
.impact span{position:absolute;left:50%;top:50%;width:78px;height:4px;transform-origin:0 50%;transform:rotate(var(--a)) scaleX(.05);background:linear-gradient(90deg,#fff,#ffd65c 35%,rgba(255,169,31,0));box-shadow:0 0 8px #ffc34c}
.impact.flash span{animation:sparkRay .62s ease-out forwards}
@keyframes impactFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes sparkRay{0%{opacity:0;transform:rotate(var(--a)) scaleX(.05)}18%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) scaleX(1.65)}}
.top-wrap.winner .top-model{filter:drop-shadow(0 13px 9px rgba(4,10,22,.38)) drop-shadow(0 0 13px rgba(255,214,74,.9))}
.top-wrap.spinout{animation:spinOut 1.25s ease-out forwards!important}.top-wrap.spinout .top-model{animation:wobble .18s linear infinite}
@keyframes spinOut{0%{opacity:1}55%{transform:translate(-50%,-50%) translate(44px,38px) scale(.9)}100%{transform:translate(-50%,-50%) translate(86px,65px) scale(.55);opacity:.35}}
@keyframes wobble{0%,100%{transform:rotateX(58deg) rotateZ(-8deg)}50%{transform:rotateX(69deg) rotateZ(3deg)}}
.top-wrap.fall-left{animation:fallLeft 1s ease-in forwards!important}.top-wrap.fall-right{animation:fallRight 1s ease-in forwards!important}.top-wrap.fall-center{animation:fallCenter 1s ease-in forwards!important}
@keyframes fallLeft{0%{left:48%;top:45%;opacity:1}65%{left:17%;top:50%;transform:translate(-50%,-50%) scale(.72)}100%{left:15%;top:52%;transform:translate(-50%,-50%) scale(.18);opacity:0}}
@keyframes fallRight{0%{left:52%;top:45%;opacity:1}65%{left:83%;top:50%;transform:translate(-50%,-50%) scale(.72)}100%{left:85%;top:52%;transform:translate(-50%,-50%) scale(.18);opacity:0}}
@keyframes fallCenter{0%{left:50%;top:45%;opacity:1}58%{left:50%;top:66%;transform:translate(-50%,-50%) scale(.7)}100%{left:50%;top:69%;transform:translate(-50%,-50%) scale(.12);opacity:0}}
.fragments{position:absolute;inset:0;display:none}.top-wrap.burst .top-model{opacity:0}.top-wrap.burst .fragments{display:block}
.fragment{position:absolute;left:50%;top:50%;width:42px;height:24px;border-radius:50% 25% 60% 30%;background:linear-gradient(135deg,#5ee6ff,#173b87 48%,#291a70);box-shadow:inset 0 3px 3px rgba(255,255,255,.55),0 4px 7px rgba(0,0,0,.25)}
.top-b .fragment{filter:hue-rotate(145deg) saturate(1.15)}
.top-wrap.burst .f1{animation:piece1 .85s ease-out forwards}.top-wrap.burst .f2{animation:piece2 .85s ease-out forwards}.top-wrap.burst .f3{animation:piece3 .85s ease-out forwards}.top-wrap.burst .f4{animation:piece4 .85s ease-out forwards}
@keyframes piece1{to{transform:translate(-72px,-68px) rotate(240deg);opacity:0}}
@keyframes piece2{to{transform:translate(64px,-52px) rotate(-260deg);opacity:0}}
@keyframes piece3{to{transform:translate(-58px,62px) rotate(310deg);opacity:0}}
@keyframes piece4{to{transform:translate(72px,58px) rotate(-330deg);opacity:0}}
.score-pop{position:absolute;left:50%;top:27%;z-index:25;transform:translate(-50%,-50%) scale(.5);opacity:0;font-size:29px;font-weight:1000;color:#fff;text-shadow:0 3px 0 #15213a,0 0 18px rgba(255,214,74,.9);white-space:nowrap}
.score-pop.show{animation:scorePop .8s cubic-bezier(.15,.8,.2,1) forwards}
@keyframes scorePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.status{text-align:center;font-size:13px;font-weight:850;color:#64748b;min-height:21px;margin:0 0 12px}
.drawbtn{width:100%;border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,#f2b62f,#d58d00);color:#fff;font-size:17px;font-weight:950;cursor:pointer;box-shadow:0 8px 18px rgba(210,141,0,.25)}.drawbtn:disabled{opacity:.72}
.result{display:none;margin-top:18px;padding-top:18px;border-top:1px dashed var(--border);text-align:center}.result.show{display:block}.battle-result{font-size:14px;font-weight:950;color:#1f497d;margin-bottom:5px}.rank{font-size:40px;font-weight:1000;margin:3px 0 6px}.rank.small-good{color:#2563eb}.rank.good{color:#15803d}.rank.great{color:#b77900}.rank.bad{color:#b42318}.rank.small-bad{color:#8b2bb4}.blessing{font-size:18px;font-weight:900;line-height:1.55;margin:4px auto 9px;max-width:570px}.sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:13px}.secondary{width:100%;border:1px solid #dbe2ea;border-radius:12px;padding:12px;background:#eef2f7;color:#334155;font-weight:900;font-size:14px}
.legend{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}.chip{font-size:11px;font-weight:850;padding:6px 8px;border-radius:999px;background:#fff;border:1px solid var(--border);color:#526071}.note{margin-top:13px;text-align:center;font-size:12px;line-height:1.55;color:#6b7280}
@media(max-width:560px){.wrap{padding:10px 9px 32px}.game-card{padding:12px;border-radius:18px}.battlefield{height:315px;border-radius:20px}.top-wrap{width:92px;height:92px}.shell{width:90px;height:90px}.metal{width:61px;height:61px}.inner{width:45px;height:45px}.core{width:27px;height:27px}.depth{bottom:-12px;height:21px}.tip{bottom:-25px;width:27px;height:30px}.hole-left,.hole-right{width:63px;height:34px}.hole-center{width:80px;height:42px}.score-pop{font-size:24px}.rank{font-size:35px}.blessing{font-size:17px}}
@media(prefers-reduced-motion:reduce){.battlefield.battle .top-a,.battlefield.battle .top-b{animation-duration:.45s}.battlefield.battle .rotor{animation-duration:.25s}.impact.flash span{animation-duration:.25s}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./index.html">← 回抽籤助手</a>
<a class="top-link" href="./index.html">🎯 直接進入正式商品抽籤 →</a>

<div class="hero">
  <div class="eyebrow">LUCKY BEY BATTLE</div>
  <h1>幸運戰鬥抽籤</h1>
  <p>正式抽籤前先打一場幸運戰。兩顆陀螺會隨機碰撞、爆裂、掉洞或轉停，再替你抽出今天的祝福籤勢。</p>
</div>

<section class="game-card">
  <div class="score-guide">
    <span class="score-chip">左右洞：2 分</span>
    <span class="score-chip">中央洞：3 分</span>
    <span class="score-chip">爆裂：爆裂勝利</span>
    <span class="score-chip">轉停：旋轉勝利</span>
  </div>

  <div id="field" class="battlefield" aria-label="戰鬥陀螺幸運競技場">
    <div class="rim"></div>
    <div class="hole hole-left"><span>2</span></div>
    <div class="hole hole-center"><span>3</span></div>
    <div class="hole hole-right"><span>2</span></div>

    <div id="topA" class="top-wrap top-a">
      <div class="top-model">
        <div class="rotor">
          <div class="layer shell"></div><div class="layer metal"></div><div class="layer inner"></div><div class="layer core"></div>
        </div>
        <div class="depth"></div><div class="tip"></div>
      </div>
      <div class="fragments"><i class="fragment f1"></i><i class="fragment f2"></i><i class="fragment f3"></i><i class="fragment f4"></i></div>
    </div>

    <div id="topB" class="top-wrap top-b">
      <div class="top-model">
        <div class="rotor">
          <div class="layer shell"></div><div class="layer metal"></div><div class="layer inner"></div><div class="layer core"></div>
        </div>
        <div class="depth"></div><div class="tip"></div>
      </div>
      <div class="fragments"><i class="fragment f1"></i><i class="fragment f2"></i><i class="fragment f3"></i><i class="fragment f4"></i></div>
    </div>

    <div id="impact" class="impact">
      <span style="--a:0deg"></span><span style="--a:45deg"></span><span style="--a:90deg"></span><span style="--a:135deg"></span>
      <span style="--a:180deg"></span><span style="--a:225deg"></span><span style="--a:270deg"></span><span style="--a:315deg"></span>
    </div>
    <div id="scorePop" class="score-pop"></div>
  </div>

  <div id="status" class="status">兩顆陀螺已就位，按下開始戰鬥！</div>
  <button id="drawBtn" class="drawbtn" type="button">⚡ 開始幸運戰鬥</button>

  <div id="result" class="result" aria-live="polite">
    <div id="battleResult" class="battle-result"></div>
    <div id="rank" class="rank"></div>
    <div id="blessing" class="blessing"></div>
    <div id="sub" class="sub"></div>
    <button id="againBtn" class="secondary" type="button">再戰一場</button>
  </div>
</section>

<div class="legend">
  <span class="chip">小吉</span><span class="chip">吉</span><span class="chip">大吉</span><span class="chip">凶＝先排除凶運</span><span class="chip">小凶＝先消耗小波折</span>
</div>
<div class="note">純娛樂祝福小遊戲，不影響實際商品抽選機率。</div>
</div>

<script>
(function(){
  const field=document.getElementById('field');
  const topA=document.getElementById('topA');
  const topB=document.getElementById('topB');
  const impact=document.getElementById('impact');
  const scorePop=document.getElementById('scorePop');
  const status=document.getElementById('status');
  const drawBtn=document.getElementById('drawBtn');
  const againBtn=document.getElementById('againBtn');
  const result=document.getElementById('result');
  const battleResult=document.getElementById('battleResult');
  const rankEl=document.getElementById('rank');
  const blessingEl=document.getElementById('blessing');
  const subEl=document.getElementById('sub');

  const fortunes=[
    {rank:'小吉',cls:'small-good',sub:'穩穩前進就是最好的運氣。',lines:['今天的好運正在升溫，下一抽值得期待。','穩定型幸運上線，越往後抽越有機會。','今天適合廣撒網，驚喜可能藏在冷門門市。']},
    {rank:'吉',cls:'good',sub:'氣勢正順，適合直接開抽。',lines:['今天抽選節奏很順，容易遇到還有名額的店。','好運已進場，今天很適合一口氣連抽。','直覺看中的門市值得先試，今天選店運不錯。']},
    {rank:'大吉',cls:'great',sub:'強運全開，今天就是要有氣勢。',lines:['大吉加持！祝你中籤，也祝你最後拿到高重好個體。','今日幸運爆表，人氣店也值得勇敢試。','幸運齒輪咬合完成，祝你抽選、取貨、實戰一路順。']},
    {rank:'凶',cls:'bad',sub:'凶運已先在小遊戲裡排除。',lines:['先把凶運撞飛了，正式抽選只留下好運。','這一場替你先擋掉不順，下一抽更值得期待。','凶籤只負責清場，祝你正式抽選反而一路順。']},
    {rank:'小凶',cls:'small-bad',sub:'小波折先在這場戰鬥消耗掉。',lines:['小凶已用掉，祝你等等抽到名額充足的門市。','今天可能多試幾家才中，但好消息通常就在下一家。','先消耗小波折，正式抽選就照自己的節奏一路抽。']}
  ];

  const outcomes=[
    {type:'spin',label:'旋轉勝利！',score:'SPIN FINISH'},
    {type:'burst',label:'爆裂勝利！',score:'BURST'},
    {type:'two-left',label:'2 分洞擊落！',score:'+2'},
    {type:'two-right',label:'2 分洞擊落！',score:'+2'},
    {type:'three',label:'3 分洞重擊！',score:'+3'}
  ];

  let timers=[];
  function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id}
  function clearTimers(){timers.forEach(clearTimeout);timers=[]}
  function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function reset(){
    clearTimers();
    field.className='battlefield';
    [topA,topB].forEach(t=>t.className=t===topA?'top-wrap top-a':'top-wrap top-b');
    impact.className='impact';
    scorePop.className='score-pop';
    scorePop.textContent='';
    result.classList.remove('show');
    status.textContent='兩顆陀螺已就位，按下開始戰鬥！';
    drawBtn.disabled=false;
    drawBtn.textContent='⚡ 開始幸運戰鬥';
    void field.offsetWidth;
  }

  function finishBattle(outcome,loser,winner){
    loser.classList.add(outcome.type==='burst'?'burst':
      outcome.type==='spin'?'spinout':
      outcome.type==='two-left'?'fall-left':
      outcome.type==='two-right'?'fall-right':'fall-center');
    winner.classList.add('winner');
    scorePop.textContent=outcome.score;
    scorePop.classList.add('show');
    status.textContent=outcome.label;

    const f=pick(fortunes), line=pick(f.lines);
    later(()=>{
      battleResult.textContent=outcome.label+'　勝者：'+(winner===topA?'蒼藍翼':'赤焰翼');
      rankEl.textContent=f.rank;
      rankEl.className='rank '+f.cls;
      blessingEl.textContent=line;
      subEl.textContent=f.sub;
      result.classList.add('show');
      drawBtn.disabled=false;
      drawBtn.textContent='⚡ 再戰一場';
      const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      result.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
    },1100);
  }

  function battle(){
    reset();
    drawBtn.disabled=true;
    result.classList.remove('show');
    status.textContent='高速旋轉中… 兩顆陀螺正在接近！';
    field.classList.add('battle');

    later(()=>{status.textContent='碰撞！';impact.classList.add('flash')},1250);
    later(()=>{
      impact.classList.remove('flash');void impact.offsetWidth;impact.classList.add('flash');
      const outcome=pick(outcomes);
      const loser=Math.random()<.5?topA:topB;
      const winner=loser===topA?topB:topA;
      if(outcome.type==='two-left' && loser===topB) outcome.type='two-right';
      else if(outcome.type==='two-right' && loser===topA) outcome.type='two-left';
      finishBattle(outcome,loser,winner);
    },2250);
  }

  drawBtn.addEventListener('click',battle);
  againBtn.addEventListener('click',battle);
})();
</script>
</body>
