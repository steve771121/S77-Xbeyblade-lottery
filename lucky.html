<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幸運抽籤祝福｜S77 戰鬥陀螺抽籤助手</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb;--navy:#13213a;--gold:#e6a817;--green:#16a34a;--red:#d9485f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#fff7df 0,#f5f7fb 42%,#eef2f7 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px 14px 42px}
.back{display:inline-flex;align-items:center;gap:6px;color:#334155;text-decoration:none;font-weight:800;font-size:14px;margin-bottom:10px}
.top-lottery-link{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 16px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,#13213a,#1f497d);color:#fff;text-decoration:none;font-size:16px;font-weight:950;box-shadow:0 8px 18px rgba(31,73,125,.2)}
.hero{text-align:center;padding:12px 4px 18px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:#9a6d00}.hero h1{font-size:30px;margin:7px 0 8px}.hero p{color:var(--muted);line-height:1.65;margin:0 auto;max-width:580px}
.stage{position:relative;background:rgba(255,255,255,.9);border:1px solid rgba(229,231,235,.95);border-radius:24px;padding:24px 18px 20px;box-shadow:0 14px 36px rgba(15,23,42,.08);overflow:hidden}
.stage:before,.stage:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);opacity:.35}.stage:before{width:170px;height:170px;background:#fde68a;top:-75px;left:-70px}.stage:after{width:150px;height:150px;background:#bfdbfe;right:-65px;bottom:-65px}
.arena{--energy:#ffd45a;--energy2:#fff6b7;position:relative;z-index:1;width:286px;height:286px;margin:0 auto 18px;border-radius:50%;overflow:hidden;background:
radial-gradient(circle at 50% 40%,rgba(255,255,255,.96) 0 8%,rgba(227,235,246,.96) 9% 24%,rgba(149,164,187,.9) 25% 27%,rgba(222,230,240,.98) 28% 43%,rgba(106,121,146,.72) 44% 46%,rgba(230,236,244,.98) 47% 64%,rgba(139,151,170,.82) 65% 68%,#dce3ec 69% 100%);box-shadow:
inset 0 0 0 3px rgba(15,23,42,.08),
inset 0 -22px 38px rgba(15,23,42,.18),
inset 0 16px 24px rgba(255,255,255,.72),
0 20px 36px rgba(15,23,42,.18)}
.arena:before{content:"";position:absolute;inset:15px;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:inset 0 0 0 8px rgba(15,23,42,.035),0 0 0 1px rgba(15,23,42,.08)}
.arena:after{content:"";position:absolute;left:50%;top:50%;width:166px;height:166px;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(31,73,125,.2);box-shadow:0 0 0 34px rgba(255,255,255,.05)}
.bey-shadow{position:absolute;left:50%;top:61%;width:150px;height:38px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(4,10,22,.4) 0,rgba(4,10,22,.18) 46%,transparent 72%);filter:blur(7px)}
.bey{position:absolute;left:50%;top:49%;width:154px;height:154px;transform:translate(-50%,-50%) rotate(0deg) scaleY(.9);transform-origin:center;border-radius:50%;filter:drop-shadow(0 15px 12px rgba(4,10,22,.36));will-change:transform}
.bey:before{content:"";position:absolute;inset:4px;border-radius:50%;background:linear-gradient(155deg,rgba(255,255,255,.68),transparent 34%,rgba(0,0,0,.3) 73%,rgba(0,0,0,.48));z-index:7;pointer-events:none;mix-blend-mode:soft-light}
.bey:after{content:"";position:absolute;left:13%;right:13%;bottom:-13px;height:24px;border-radius:50%;background:linear-gradient(180deg,#1b2a42,#07101f);z-index:-1;box-shadow:inset 0 -5px 8px #02060c}
.bey-core,.bey-ring,.bey-blade,.bey-metal{position:absolute;border-radius:50%}
.bey-ring{inset:0;background:conic-gradient(from 0deg,#081426 0 7%,#2b67a7 7% 17%,#f7c833 17% 24%,#d7e0eb 24% 29%,#152c4d 29% 41%,#5f8fc2 41% 49%,#f3b51b 49% 57%,#eef3f8 57% 62%,#0d223c 62% 75%,#3f76b4 75% 83%,#f5c63a 83% 90%,#dce6f0 90% 95%,#09172a 95% 100%);clip-path:polygon(50% 0,61% 12%,76% 5%,82% 23%,98% 30%,88% 45%,100% 58%,82% 67%,88% 86%,67% 84%,58% 100%,45% 87%,27% 98%,24% 77%,5% 82%,13% 61%,0 48%,16% 37%,9% 17%,30% 18%)}
.bey-metal{inset:16px;background:conic-gradient(#f9fbfd,#76859a,#e8eef5,#5d6e86,#fff,#7a899d,#e4ebf3,#55657c,#f9fbfd);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),inset 0 -8px 14px rgba(0,0,0,.25),0 0 0 2px rgba(17,24,39,.24)}
.bey-blade{inset:28px;background:conic-gradient(from 18deg,#16355c 0 18%,#3573b6 18% 34%,#0b1b31 34% 50%,#f0b92d 50% 63%,#173b67 63% 82%,#071424 82% 100%);clip-path:polygon(50% 0,63% 19%,84% 10%,80% 34%,100% 47%,78% 60%,84% 87%,61% 78%,47% 100%,34% 77%,8% 85%,18% 58%,0 43%,22% 31%,15% 8%,38% 20%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.42)}
.bey-core{inset:52px;background:radial-gradient(circle at 40% 32%,#fff 0 9%,#ffe58a 10% 22%,#f0b91c 23% 40%,#2f68a7 41% 62%,#102641 63% 80%,#050b13 81% 100%);box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 0 8px rgba(16,38,65,.68),inset 0 -7px 10px rgba(0,0,0,.3);z-index:5}
.motion-ring{position:absolute;left:50%;top:49%;width:174px;height:174px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid rgba(91,157,231,.0);opacity:0;pointer-events:none}
.arena.active .motion-ring{animation:motionRing .34s linear infinite}
.energy-rays{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:8}
.energy-rays span{--i:0;position:absolute;left:50%;top:50%;width:112px;height:5px;transform-origin:0 50%;transform:translate(0,-50%) rotate(calc(var(--i)*22.5deg)) scaleX(.05);border-radius:999px;background:linear-gradient(90deg,var(--energy2),var(--energy) 35%,rgba(255,255,255,0));box-shadow:0 0 8px var(--energy),0 0 18px var(--energy);opacity:0}
.energy-core{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%) scale(.1);border-radius:50%;background:#fff;box-shadow:0 0 18px #fff,0 0 38px var(--energy),0 0 72px var(--energy);opacity:0;z-index:9;pointer-events:none}
.shockwave,.shockwave2{position:absolute;left:50%;top:50%;width:72px;height:72px;transform:translate(-50%,-50%) scale(.2);border-radius:50%;border:4px solid var(--energy2);box-shadow:0 0 15px var(--energy),inset 0 0 14px var(--energy);opacity:0;z-index:8;pointer-events:none}
.spark{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 9px var(--energy),0 0 16px var(--energy);opacity:0;z-index:10;pointer-events:none}
.arena[data-fortune="small-good"]{--energy:#54a6ff;--energy2:#d7ecff}
.arena[data-fortune="good"]{--energy:#58d68d;--energy2:#d9ffe7}
.arena[data-fortune="great"]{--energy:#ffd34f;--energy2:#fff2ad}
.arena[data-fortune="bad"]{--energy:#ff6d78;--energy2:#ffd9dc}
.arena[data-fortune="small-bad"]{--energy:#d98cff;--energy2:#f1dcff}
.bey.spinning{animation:beySpin 2.55s cubic-bezier(.06,.72,.18,1) forwards}
.arena.active{animation:arenaRumble .18s linear 11}
.arena.burst .energy-rays{opacity:1}
.arena.burst .energy-rays span{animation:rayBurst .72s cubic-bezier(.1,.76,.26,1) forwards}
.arena.burst .energy-core{animation:coreFlash .62s ease-out forwards}
.arena.burst .shockwave{animation:shock 1s ease-out forwards}
.arena.burst .shockwave2{animation:shock 1.05s .11s ease-out forwards}
.arena.burst .spark{animation:sparkFly .9s ease-out forwards}
.spin-status{position:relative;z-index:1;text-align:center;font-size:13px;font-weight:850;color:#64748b;margin:-4px 0 14px;min-height:20px}
@keyframes beySpin{0%{transform:translate(-50%,-50%) rotate(0deg) scaleY(.9) scale(.9)}12%{transform:translate(-50%,-50%) rotate(540deg) scaleY(.9) scale(1.04)}58%{transform:translate(-50%,-50%) rotate(2700deg) scaleY(.9) scale(1.08)}82%{transform:translate(-50%,-50%) rotate(3510deg) scaleY(.9) scale(1.02)}100%{transform:translate(-50%,-50%) rotate(3780deg) scaleY(.9) scale(1)}}
@keyframes motionRing{0%{transform:translate(-50%,-50%) scale(.78);border-color:rgba(91,157,231,.72);opacity:.72}100%{transform:translate(-50%,-50%) scale(1.38);border-color:rgba(91,157,231,0);opacity:0}}
@keyframes arenaRumble{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes rayBurst{0%{opacity:0;transform:translate(0,-50%) rotate(calc(var(--i)*22.5deg)) scaleX(.04)}18%{opacity:1}100%{opacity:0;transform:translate(0,-50%) rotate(calc(var(--i)*22.5deg)) scaleX(1.45)}}
@keyframes coreFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.9)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.8)}}
@keyframes shock{0%{opacity:.95;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.5)}}
@keyframes sparkFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateX(8px) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(.3)}}
.result{--rank-glow:rgba(37,99,235,.25)}
.result.reveal .rank{animation:rankPop .72s cubic-bezier(.12,.8,.2,1) both;text-shadow:0 0 18px var(--rank-glow)}
.result.reveal .blessing{animation:textRise .52s .12s ease-out both}
.result.reveal .sub{animation:textRise .52s .2s ease-out both}
.result:has(.rank.great){--rank-glow:rgba(217,150,0,.45)}
.result:has(.rank.good){--rank-glow:rgba(21,128,61,.3)}
.result:has(.rank.bad){--rank-glow:rgba(180,35,24,.28)}
.result:has(.rank.small-bad){--rank-glow:rgba(159,18,57,.26)}
@keyframes rankPop{0%{opacity:0;transform:scale(.45);filter:blur(8px)}55%{opacity:1;transform:scale(1.16);filter:blur(0)}100%{opacity:1;transform:scale(1)}}
@keyframes textRise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.drawbtn{position:relative;z-index:1;width:100%;border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,#f0b429,#d99600);color:#fff;font-size:17px;font-weight:950;cursor:pointer;box-shadow:0 8px 18px rgba(217,150,0,.25)}
.drawbtn:active{transform:translateY(1px)}.drawbtn:disabled{opacity:.7;cursor:default}
.result{display:none;position:relative;z-index:1;margin-top:18px;border-top:1px dashed var(--border);padding-top:18px;text-align:center}
.result.show{display:block}.rank{font-size:40px;font-weight:950;letter-spacing:.04em;margin-bottom:6px}.rank.small-good{color:#2563eb}.rank.good{color:#15803d}.rank.great{color:#c28100}.rank.bad{color:#b42318}.rank.small-bad{color:#9f1239}
.blessing{font-size:18px;font-weight:850;line-height:1.55;margin:6px auto 10px;max-width:560px}.sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions.one-action{grid-template-columns:1fr}.secondary,.primary{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:12px 13px;font-weight:900;font-size:14px}.secondary{background:#eef2f7;color:#334155;border:1px solid #dbe2ea}.primary{background:#13213a;color:#fff}
.legend{margin-top:16px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.chip{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#fff;border:1px solid var(--border);color:#475569}
.note{margin-top:16px;color:#64748b;font-size:12px;line-height:1.6;text-align:center}
@media(max-width:520px){.wrap{padding:12px 10px 32px}.hero h1{font-size:25px}.stage{padding:20px 14px 16px;border-radius:18px}.arena{width:238px;height:238px}.bey{width:130px;height:130px}.bey-core{inset:44px}.bey-metal{inset:14px}.bey-blade{inset:24px}.rank{font-size:36px}.blessing{font-size:17px}.actions{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.bey.spinning{animation:beySpinReduced .48s ease forwards}.arena.active{animation:none}.arena.burst .energy-rays span{animation-duration:.25s}.arena.burst .shockwave,.arena.burst .shockwave2{animation-duration:.35s}@keyframes beySpinReduced{from{transform:translate(-50%,-50%) rotate(0deg) scaleY(.9)}to{transform:translate(-50%,-50%) rotate(360deg) scaleY(.9)}}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./index.html">← 回抽籤助手</a>
<a class="top-lottery-link" href="./index.html">🎯 直接進入正式商品抽籤 →</a>
<div class="hero">
  <div class="eyebrow">BEYBLADE LUCKY FORTUNE</div>
  <h1>幸運抽籤祝福</h1>
  <p>想先玩一下就轉陀螺抽今日籤勢；如果想直接抽商品，上方按鈕隨時可以進正式抽籤。所有籤都是祝福，就算抽到「凶」也代表先把凶運抽掉。</p>
</div>

<section class="stage">
  <div id="arena" class="arena" aria-hidden="true">
    <div class="bey-shadow"></div>
    <div class="motion-ring"></div>
    <div id="bey" class="bey">
      <div class="bey-ring"></div>
      <div class="bey-metal"></div>
      <div class="bey-blade"></div>
      <div class="bey-core"></div>
    </div>
    <div class="energy-rays">
      <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span><span style="--i:13"></span><span style="--i:14"></span><span style="--i:15"></span>
    </div>
    <div class="energy-core"></div>
    <div class="shockwave"></div>
    <div class="shockwave2"></div>
    <span class="spark" style="--a:12deg;--d:122px"></span><span class="spark" style="--a:48deg;--d:104px"></span><span class="spark" style="--a:83deg;--d:132px"></span><span class="spark" style="--a:126deg;--d:112px"></span><span class="spark" style="--a:166deg;--d:128px"></span><span class="spark" style="--a:211deg;--d:106px"></span><span class="spark" style="--a:255deg;--d:134px"></span><span class="spark" style="--a:304deg;--d:116px"></span>
  </div>
  <div id="spinStatus" class="spin-status">讓陀螺替你決定今天的幸運籤勢</div>
  <button id="drawBtn" class="drawbtn" type="button">旋轉陀螺・抽今日祝福</button>

  <div id="result" class="result" aria-live="polite">
    <div id="rank" class="rank"></div>
    <div id="blessing" class="blessing"></div>
    <div id="sub" class="sub"></div>
    <div class="actions one-action">
      <button id="againBtn" class="secondary" type="button">再抽一次</button>
    </div>
  </div>
</section>

<div class="legend">
  <span class="chip">小吉</span><span class="chip">吉</span><span class="chip">大吉</span><span class="chip">凶＝凶運先排除</span><span class="chip">小凶＝先消耗小波折</span>
</div>
<div class="note">純娛樂祝福小遊戲，不影響實際抽選機率。真正的幸運，留給下一個按下「直接抽籤」的瞬間。</div>
</div>

<script>
(function(){
  const root=document;
  const arena=root.getElementById('arena');
  const bey=root.getElementById('bey');
  const spinStatus=root.getElementById('spinStatus');
  const drawBtn=root.getElementById('drawBtn');
  const againBtn=root.getElementById('againBtn');
  const result=root.getElementById('result');
  const rankEl=root.getElementById('rank');
  const blessingEl=root.getElementById('blessing');
  const subEl=root.getElementById('sub');

  const fortunes=[
    {rank:'小吉',cls:'small-good',sub:'穩穩前進就是最好的運氣。',lines:[
      '今天手感很順，容易抽到你真正想要的那一家。',
      '小小好運已經上線，接下來每一次點擊都比上一抽更接近目標。',
      '今天適合慢慢抽、穩穩中，幸運會從不起眼的門市出現。',
      '看似普通的一抽，可能藏著意外驚喜。',
      '你的好運正在升溫，先從第一家開始就對了。',
      '今天是耐心型幸運，越往後抽越有感。'
    ]},
    {rank:'吉',cls:'good',sub:'氣勢不錯，適合直接開抽。',lines:[
      '今日抽選氣場順暢，容易遇到名額還很有餘裕的門市。',
      '好運已經排隊進場，今天很適合一口氣連抽。',
      '你的抽選節奏很對，容易在意想不到的店家拿到好結果。',
      '今天有「選對店」的運氣，直覺看中的那一家值得先抽。',
      '幸運值正在高檔，適合把想抽的店一次跑完。',
      '今天的關鍵字是「順」，抽選流程會比你預期更順利。'
    ]},
    {rank:'大吉',cls:'great',sub:'今天就是要有氣勢。',lines:[
      '大吉加持！有機會抽到理想門市，也祝你最後拿到高重好個體。',
      '今日幸運爆表，適合直接開啟自動連抽模式一路衝。',
      '你今天有強運護體，祝你抽選中籤、開盒再中高重。',
      '大吉降臨，人氣店也值得勇敢試一輪。',
      '今天是「該出手就出手」的日子，祝你抽到心中的第一順位。',
      '幸運齒輪已經咬合，祝你抽選、取貨、實戰一路順。'
    ]},
    {rank:'凶',cls:'bad',sub:'別怕，凶籤是先幫你把凶運抽掉。',lines:[
      '恭喜先把凶運抽走了，真正抽選時只留下好運；再祝你拿到高重陀螺。',
      '這張凶籤是避雷符：今天容易避開額滿門市，直接找到還有機會的店。',
      '凶運已在小遊戲裡消耗完畢，正式抽籤請放心往前衝。',
      '先凶後吉！把不順留在這張籤，祝你正式抽選反而一路順。',
      '這不是壞籤，是替你擋掉一次空手而回；接下來更值得抽。',
      '今天的凶只負責清場，讓真正的幸運有位置進來。'
    ]},
    {rank:'小凶',cls:'small-bad',sub:'小波折先在這裡消耗掉。',lines:[
      '小凶已用掉，祝你等等抽到名額充足、取貨方便的門市。',
      '今天可能多按幾家才中，但好消息通常就在下一家。',
      '先遇一點小波折，後面更容易出現驚喜結果。',
      '小凶代表提醒：別只鎖定熱門店，冷門門市可能才是你的幸運點。',
      '今天適合廣撒網，多抽幾家，幸運會從其中一間冒出來。',
      '把小不順留在這張籤，正式抽選就照自己的節奏走。'
    ]}
  ];

  function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
  let timer=null;
  function draw(){
    if(timer) clearTimeout(timer);
    drawBtn.disabled=true;
    result.classList.remove('show','reveal');
    bey.classList.remove('spinning');
    arena.classList.remove('active','burst');
    arena.removeAttribute('data-fortune');
    void bey.offsetWidth;
    bey.classList.add('spinning');
    arena.classList.add('active');
    spinStatus.textContent='戰鬥陀螺高速旋轉中… 能量正在聚集！';
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const wait=reduce?520:2580;
    timer=setTimeout(function(){
      const f=pick(fortunes);
      const line=pick(f.lines);
      arena.classList.remove('active');
      arena.setAttribute('data-fortune',f.cls);
      void arena.offsetWidth;
      arena.classList.add('burst');
      rankEl.textContent=f.rank;
      rankEl.className='rank '+f.cls;
      blessingEl.textContent=line;
      subEl.textContent=f.sub;
      spinStatus.textContent='能量爆發！今天的籤勢是「'+f.rank+'」';
      setTimeout(function(){
        result.classList.add('show','reveal');
        drawBtn.disabled=false;
        drawBtn.textContent='再次啟動陀螺';
        result.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
      },reduce?120:330);
    },wait);
  }

  drawBtn.addEventListener('click',draw);
  againBtn.addEventListener('click',draw);
})();
</script>
</body>
</html>
