name: Sync lottery data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-lottery.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest lottery page
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/UXUX11/funbox-line/main/index.html \
            -o index.latest.html

      - name: Keep S77 direct-product lottery UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.latest.html")
          s = p.read_text(encoding="utf-8")
          css = r'''<style id="s77-direct-draw-style">
          #stores-title,#stores-subtitle,#storeGrid,body > .filter-btn-group{display:none!important}
          #page-draws{display:block!important}
          #page-draws .draw-item{gap:10px}
          #page-draws .s77-direct-draw-btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:8px 12px;border-radius:8px;background:#00c300;color:#fff;text-decoration:none;font-size:13px;font-weight:800;line-height:1}
          #page-draws .draw-item.quick-drawn .s77-direct-draw-btn{background:#a0a0a0}
          @media(max-width:520px){#page-draws .s77-direct-draw-btn{min-width:82px;padding:8px 10px;font-size:12px}}
          </style>'''
          js = r'''<script id="s77-direct-draw-script">
          (function(){
            function addDirectButtons(){
              document.querySelectorAll('#page-draws .draw-item[data-draw-href]').forEach(function(row){
                if(row.querySelector('.s77-direct-draw-btn')) return;
                var href=row.getAttribute('data-draw-href'); if(!href) return;
                var a=document.createElement('a');
                a.className='s77-direct-draw-btn'; a.href=href; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent='直接抽籤';
                a.addEventListener('click',function(e){
                  e.preventDefault(); e.stopPropagation();
                  if(typeof window.openDrawRow==='function') window.openDrawRow(e,row);
                  else window.open(href,'_blank','noopener,noreferrer');
                });
                row.appendChild(a);
              });
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addDirectButtons); else addDirectButtons();
            window.addEventListener('pageshow',addDirectButtons);
          })();
          </script>'''
          banner = r'''<div id="s77-lucky-banner" style="max-width:1000px;margin:10px auto 16px;padding:0 4px;">
            <a href="./lucky.html" style="display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;background:linear-gradient(135deg,#fff8dd,#fffdf7);border:1px solid #f0d98a;border-radius:16px;padding:14px 16px;box-shadow:0 3px 10px rgba(0,0,0,.05);color:#3f2f00;">
              <div style="min-width:0;"><div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:#9a6d00;margin-bottom:4px;">開抽前先玩一下</div><div style="font-size:18px;font-weight:900;line-height:1.3;">🎯 幸運抽籤祝福</div><div style="font-size:13px;color:#786014;margin-top:5px;line-height:1.45;">抽小吉／吉／大吉／凶／小凶，先把凶運抽掉，再帶著祝福去正式抽選。</div></div>
              <div style="flex:0 0 auto;background:#d99a00;color:#fff;font-size:13px;font-weight:900;padding:9px 12px;border-radius:999px;white-space:nowrap;">抽今日運勢 →</div>
            </a>
          </div>'''
          s = s.replace("</head>", css + "\n</head>")
          s = s.replace("<body>", "<body>\n" + banner)
          s = s.replace("</body>", js + "\n</body>")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Update index.html when changed
        run: |
          if cmp -s index.latest.html index.html; then
            echo "No changes found."
            rm index.latest.html
            exit 0
          fi

          mv index.latest.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync latest lottery data"
          git push
